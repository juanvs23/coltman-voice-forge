[project]
name = "voice-forge"
version = "0.1.0"
description = "Local-first voice catalog: design, clone and narrate with fine emotional control."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
voice-forge = "voiceforge.adapters.primary.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs a real engine host and GPU"]
